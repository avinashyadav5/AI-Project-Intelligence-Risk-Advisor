services:
  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-riskadvisor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-riskadvisor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Python AI microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - RUN_ALL_AGENTS=${RUN_ALL_AGENTS:-}
    volumes:
      # The FAISS indexes are the project knowledge base. Without a volume they
      # were wiped on every container restart, which defeated the whole point
      # of persistent project memory.
      - kb_data:/app/knowledge_base
      - ai_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      # The embedding model downloads on first boot, so allow time before
      # marking the service unhealthy.
      start_period: 180s
    networks:
      - app_network
    restart: unless-stopped

  # Node Express API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-riskadvisor}?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your .env before starting}
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      # Uploaded files must outlive the container, or every restart orphans
      # every document row.
      - server_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - app_network
    restart: unless-stopped

  # React client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Vite inlines env vars at BUILD time. This was previously passed as a
        # runtime environment variable, where it had no effect at all.
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
  kb_data:
  ai_uploads:
  server_uploads:

networks:
  app_network:
    driver: bridge
